/* ======================================================================
   00-base.css : tokens, typography, controls, tables, charts, overlays
   Palettes: chart colours validated with the dataviz validator (light: #5B3FD9 #0A94B5 #BA7700 #D6336C,
   dark: #8272EA #12A0C0 #B9820F #DB4C7C). Colour is never the only carrier of meaning.
   ====================================================================== */
:root {
  --ink-950:#070C1C; --ink-900:#0B1228; --ink-800:#111A38; --ink-700:#1A2347; --ink-600:#26325E; --ink-500:#3A4880;
  --font: 'Archivo Variable', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --r-s: 4px; --r-m: 6px; --r-l: 10px;
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --raised:#FFFFFF;
  --line:#DCE1EC; --line-2:#BFC8DA; --text:#101830; --text-2:#414C69; --text-3:#5B6683;
  --accent:#5B3FD9; --accent-fill:#5B3FD9; --accent-ink:#4A2FC4; --accent-soft:#ECE8FC; --on-accent:#FFFFFF;
  --cyan:#0A94B5; --cyan-ink:#066E88; --cyan-soft:#DDF3F8;
  --ok:#0F7A4B; --ok-bg:#E1F4EA; --warn:#85530A; --warn-bg:#FFF0CF; --bad:#B3261E; --bad-bg:#FCE6E4; --neutral:#4A5472; --neutral-bg:#EBEEF5;
  --focus:#0A94B5;
  --c0:#5B3FD9; --c1:#0A94B5; --c2:#BA7700; --c3:#D6336C; --ink:#101830;
  --chart-grid:#E3E8F1; --chart-axis:#B4BED2;
  --shadow: 0 1px 2px rgba(11,18,40,.06), 0 6px 18px -8px rgba(11,18,40,.18);
  --gut: clamp(16px, 3vw, 40px);
}
.theme-dark, [data-route="customer"] #shell {
  --bg:#070C1C; --surface:#0F1733; --surface-2:#141D40; --raised:#1A2450;
  --line:#27335F; --line-2:#3A4880; --text:#F2F4FF; --text-2:#B7C0E0; --text-3:#8F9AC4;
  --accent:#A99CFF; --accent-fill:#6E56F0; --accent-ink:#B9AEFF; --accent-soft:#22185C; --on-accent:#FFFFFF;
  --cyan:#22D3EE; --cyan-ink:#5AE0F3; --cyan-soft:#0C2B3D;
  --ok:#4ADE9A; --ok-bg:#0D3324; --warn:#F5B94A; --warn-bg:#3A2A08; --bad:#FF8A80; --bad-bg:#3D1512; --neutral:#B7C0E0; --neutral-bg:#1A2450;
  --focus:#22D3EE;
  --c0:#8272EA; --c1:#12A0C0; --c2:#B9820F; --c3:#DB4C7C; --ink:#F2F4FF;
  --chart-grid:#222D56; --chart-axis:#3A4880;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -14px rgba(0,0,0,.6);
}
.theme-light { /* analytical sheets inside dark pages */
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --raised:#FFFFFF;
  --line:#DCE1EC; --line-2:#BFC8DA; --text:#101830; --text-2:#414C69; --text-3:#5B6683;
  --accent:#5B3FD9; --accent-ink:#4A2FC4; --accent-soft:#ECE8FC; --cyan:#0A94B5; --cyan-ink:#066E88; --cyan-soft:#DDF3F8;
  --ok:#0F7A4B; --ok-bg:#E1F4EA; --warn:#85530A; --warn-bg:#FFF0CF; --bad:#B3261E; --bad-bg:#FCE6E4; --neutral:#4A5472; --neutral-bg:#EBEEF5; --focus:#0A94B5;
  --c0:#5B3FD9; --c1:#0A94B5; --c2:#BA7700; --c3:#D6336C; --ink:#101830; --chart-grid:#E3E8F1; --chart-axis:#B4BED2; --shadow: 0 1px 2px rgba(11,18,40,.06), 0 6px 18px -8px rgba(11,18,40,.18);
  color: var(--text); background: var(--surface);
}
*,*::before,*::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *,*::before,*::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--text); background: var(--bg); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
#shell { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
#main { flex: 1 0 auto; outline: none; }
h1,h2,h3,h4 { margin: 0; font-weight: 700; letter-spacing: -.012em; line-height: 1.15; font-stretch: 106%; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
ul,ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
table { border-collapse: collapse; }
.sr, .skip:not(:focus) { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip:focus { position: fixed; left: 12px; top: 12px; z-index: 1000; background: #fff; color: #000; padding: 10px 14px; border-radius: 6px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.wrap { width: 100%; max-width: 1560px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut); }
.ic { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.17em; }
.muted { color: var(--text-3); } .num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.stack > * + * { margin-top: var(--gap, 16px); }

/* ----- buttons ----- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r-m); border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, transform .08s; }
.btn:hover { border-color: var(--text-3); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent-fill) 88%, #fff); border-color: transparent; }
.btn-cyan { background: var(--cyan); border-color: var(--cyan); color: #04202A; }
.btn-cyan:hover { background: color-mix(in srgb, var(--cyan) 86%, #fff); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: color-mix(in srgb, var(--text) 8%, transparent); border-color: transparent; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-sm { min-height: 32px; padding: 0 11px; font-size: 13px; }
.btn-lg { min-height: 48px; padding: 0 22px; font-size: 15px; }
.btn-icon { width: 40px; padding: 0; }
.btn-sm.btn-icon { width: 32px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ----- form controls ----- */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl, legend.lbl { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.field .hint { font-size: 12.5px; color: var(--text-3); }
.field .err { font-size: 12.5px; color: var(--bad); display: flex; gap: 6px; align-items: flex-start; }
.field.invalid input { border-color: var(--bad); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
input[type=text], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r-m); transition: border-color .15s, box-shadow .15s;
}
input[type=number] { font-variant-numeric: tabular-nums; }
input:hover, select:hover { border-color: var(--text-3); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.inwrap { position: relative; } .inwrap input { padding-right: 52px; } .inwrap .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 13px; pointer-events: none; }
.inwrap.pre input { padding-left: 28px; padding-right: 12px; } .inwrap.pre .unit { left: 12px; right: auto; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; padding: 0; border: 0; min-height: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--line-2); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: var(--accent-fill); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--accent-fill); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent-fill); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--accent-fill); }
input[type=range]:focus-visible { outline: none; } input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 45%, transparent); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent-fill); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-m); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; min-height: 32px; font-size: 13px; font-weight: 600; color: var(--text-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-opt { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: transparent; color: var(--text-2); font-size: 13.5px; font-weight: 600; }
.pill-opt:hover { border-color: var(--text-3); color: var(--text); }
.pill-opt[aria-pressed="true"], .pill-opt[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.pill-opt .ic { width: 15px; height: 15px; }

/* ----- chips, statuses, info ----- */
.chip { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-size: 12px; font-weight: 600; color: var(--text-2); cursor: help; line-height: 1; white-space: nowrap; }
.chip.c-sim, .chip.c-ass { border-style: dashed; }
.chip.c-case { border-color: var(--cyan); color: var(--cyan-ink); } .chip.c-ext { border-color: var(--ok); color: var(--ok); } .chip.c-tgt { border-color: var(--accent); color: var(--accent-ink); }
.chip.c-dsg { border-color: var(--text-3); }
.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--neutral-bg); color: var(--neutral); white-space: nowrap; }
.tag.arena { background: color-mix(in srgb, var(--c1) 18%, transparent); color: var(--cyan-ink); } .tag.nexa { background: color-mix(in srgb, var(--c0) 20%, transparent); color: var(--accent-ink); }
.st { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 9px; border-radius: 4px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.st .ic { width: 14px; height: 14px; }
.st-ok { background: var(--ok-bg); color: var(--ok); } .st-warn { background: var(--warn-bg); color: var(--warn); } .st-bad { background: var(--bad-bg); color: var(--bad); } .st-neutral { background: var(--neutral-bg); color: var(--neutral); }
.info { display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; background: transparent; color: var(--text-3); border-radius: 50%; }
.info:hover { color: var(--accent-ink); background: var(--accent-soft); } .info .ic { width: 15px; height: 15px; }

/* ----- panels, tables ----- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: clamp(16px, 2vw, 24px); min-width: 0; }
.panel-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
.panel-title { font-size: 17px; } .panel-sub { color: var(--text-3); font-size: 13.5px; margin-top: 4px; max-width: 70ch; }
.panel-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .kv:last-child { border-bottom: 0; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; font-weight: 600; text-align: right; }
dl { margin: 0; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.tbl { width: 100%; font-size: 13.5px; }
.tbl caption { text-align: left; padding: 10px 14px; font-weight: 700; color: var(--text-2); }
.tbl th, .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--text-2); white-space: nowrap; z-index: 1; }
.tbl tbody th { font-weight: 600; } .tbl tbody tr:last-child > * { border-bottom: 0; }
.tbl th.num, .tbl td.num { text-align: right; }
.tbl tbody tr:hover > * { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.empty { display: grid; place-items: center; gap: 8px; text-align: center; padding: 36px 20px; color: var(--text-2); border: 1px dashed var(--line-2); border-radius: var(--r-m); }
.empty .ic { width: 28px; height: 28px; color: var(--text-3); } .empty p { max-width: 52ch; font-size: 14px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-m); font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
.note .ic { margin-top: 2px; color: var(--text-3); } .note.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; } .note.warn .ic { color: inherit; }
.note.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; } .note.bad .ic { color: inherit; } .note.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; } .note.ok .ic { color: inherit; }
.note.cyan { background: var(--cyan-soft); color: var(--cyan-ink); border-color: transparent; } .note.cyan .ic { color: inherit; }
.note strong { color: inherit; }

/* ----- charts ----- */
.chartcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: clamp(14px, 2vw, 22px); min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.cc-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.cc-title { font-size: 16px; } .cc-q { color: var(--text-3); font-size: 13px; margin-top: 3px; max-width: 64ch; }
.cc-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cc-how, .cc-foot { font-size: 12.5px; color: var(--text-3); max-width: 90ch; } .cc-how strong { color: var(--text-2); }
.chartbox { width: 100%; min-width: 0; } svg.chart { display: block; overflow: visible; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-2); } .legend li { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; } .sw.dash { background: transparent !important; border: 2px dashed currentColor; }
.f0 { fill: var(--c0); background: var(--c0); } .f1 { fill: var(--c1); background: var(--c1); } .f2 { fill: var(--c2); background: var(--c2); } .f3 { fill: var(--c3); background: var(--c3); }
.f-ok { fill: var(--ok); background: var(--ok); } .f-bad { fill: var(--bad); background: var(--bad); } .f-warn { fill: var(--warn); background: var(--warn); } .f-mute { fill: var(--line-2); background: var(--line-2); } .f-ink { fill: var(--ink); background: var(--ink); }
.k0 { stroke: var(--c0); } .k1 { stroke: var(--c1); } .k2 { stroke: var(--c2); } .k3 { stroke: var(--c3); }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; } .chart .grid.zero { stroke: var(--chart-axis); } .chart .grid.zero.strong { stroke: var(--text-3); stroke-width: 1.5; }
.chart .ax { fill: var(--text-3); font-size: 12px; } .chart .lab { fill: var(--text-2); } .chart .lab.dim { opacity: .55; } .chart .val { fill: var(--text); font-weight: 650; } .chart .ax-title { fill: var(--text-3); font-size: 11.5px; }
.chart .seg { fill: #fff; font-size: 12px; font-weight: 700; }
.chart .gap { stroke: var(--surface); stroke-width: 2; } .chart .dimmed { opacity: .35; }
.chart .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; } .chart .line.dash { stroke-dasharray: 6 5; }
.chart .pt { stroke: var(--surface); stroke-width: 2; } .chart .conn { stroke: var(--chart-axis); stroke-dasharray: 3 3; }
.chart .band .xh { stroke: var(--text-3); stroke-dasharray: 3 3; opacity: 0; } .chart .band:hover .xh, .chart .band:focus-within .xh { opacity: 1; }
.chart .hit { fill: transparent; } .chart .ci { stroke-width: 2.5; stroke-linecap: round; fill: none; }
.chart .base { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; } .chart .budget { stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 5 4; } .chart .budget-t { fill: var(--cyan-ink); font-weight: 700; }
.chart [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.chart rect[tabindex]:hover { filter: brightness(1.08); }

/* ----- shell ----- */
.top { position: sticky; top: 0; z-index: 60; background: var(--ink-900); color: #F2F4FF; border-bottom: 1px solid var(--ink-600); }
.top-in { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.logo-chip { background: #fff; border-radius: 6px; padding: 5px 9px; display: grid; place-items: center; height: 38px; }
.logo-chip img { display: block; height: 28px; width: auto; max-width: 140px; }
.brand-name { display: grid; line-height: 1.15; } .brand-name strong { font-size: 15px; font-weight: 700; font-stretch: 108%; letter-spacing: -.01em; } .brand-name span { font-size: 12px; color: #B7C0E0; }
.nav { display: flex; gap: 4px; margin-left: clamp(0px, 2vw, 24px); }
.nav a { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 6px; color: #B7C0E0; text-decoration: none; font-weight: 650; font-size: 14.5px; border-bottom: 2px solid transparent; }
.nav a:hover { color: #fff; background: rgba(255,255,255,.06); }
.nav a[aria-current="page"] { color: #fff; background: var(--ink-700); border-bottom-color: #22D3EE; }
.top-tools { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.top .btn { background: transparent; border-color: var(--ink-500); color: #F2F4FF; min-height: 36px; font-size: 13px; }
.top .btn:hover { background: var(--ink-700); border-color: #6572B4; }
.proto-banner { background: var(--ink-800); color: #B7C0E0; font-size: 12.5px; border-bottom: 1px solid var(--ink-600); }
.proto-banner .wrap { display: flex; gap: 10px; align-items: center; min-height: 34px; padding-top: 5px; padding-bottom: 5px; }
.proto-banner .ic { color: #F5B94A; } .proto-banner b { color: #F2F4FF; font-weight: 650; }
.foot { background: var(--ink-950); color: #8F9AC4; font-size: 12.5px; padding: 22px 0 28px; border-top: 1px solid var(--ink-700); }
.foot .wrap { display: flex; gap: 12px 28px; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; } .foot p { max-width: 74ch; } .foot a { color: #B7C0E0; }
@media (max-width: 860px) { .brand-name span { display: none; } .nav { order: 3; width: 100%; margin: 0; } .nav a { flex: 1; justify-content: center; padding: 0 8px; } .top-tools { margin-left: auto; } }
@media (max-width: 520px) { .top .btn .t { display: none; } .top .btn { width: 36px; padding: 0; } .brand-name strong { font-size: 13.5px; } }

/* ----- overlays ----- */
#tip { position: fixed; z-index: 400; max-width: min(340px, calc(100vw - 16px)); pointer-events: none; background: var(--ink-950); color: #F2F4FF; border: 1px solid var(--ink-500); border-radius: 6px; padding: 9px 12px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); white-space: pre-line; }
#tip .tip-t { display: block; font-size: 12px; color: #22D3EE; margin-bottom: 3px; }
.layer { position: fixed; inset: 0; z-index: 300; display: flex; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(5,8,20,.62); animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } } @keyframes slide { from { transform: translateX(28px); opacity: 0; } } @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.drawer { position: relative; width: min(520px, 100vw); background: var(--surface); color: var(--text); height: 100%; display: flex; flex-direction: column; box-shadow: -20px 0 40px -20px rgba(0,0,0,.5); animation: slide .2s ease-out; }
.drawer-wide { width: min(780px, 100vw); }
.drawer-head { display: flex; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.drawer-title { font-size: 20px; } .drawer-sub { color: var(--text-3); font-size: 13px; margin-top: 4px; }
.drawer-body { padding: 20px 22px 32px; overflow: auto; flex: 1; } .drawer-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
.dialog { position: relative; margin: auto; width: min(480px, calc(100vw - 32px)); background: var(--surface); color: var(--text); border-radius: 12px; padding: 24px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); animation: rise .18s ease-out; border: 1px solid var(--line); }
.dialog-title { font-size: 20px; margin-bottom: 10px; } .dialog-body { color: var(--text-2); font-size: 14.5px; } .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.toasts { position: fixed; z-index: 350; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; background: var(--ink-950); color: #F2F4FF; border: 1px solid var(--ink-500); border-left: 3px solid #22D3EE; border-radius: 6px; padding: 10px 10px 10px 14px; font-size: 13.5px; box-shadow: 0 16px 36px -12px rgba(0,0,0,.6); animation: rise .2s ease-out; }
.toast.out { opacity: 0; transform: translateY(6px); transition: .18s; } .toast-msg { flex: 1; }
.toast-btn { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--ink-500); background: transparent; color: #22D3EE; border-radius: 5px; padding: 4px 9px; font-weight: 650; font-size: 13px; }
.toast-x { border: 0; background: transparent; color: #8F9AC4; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 4px; }

/* ----- photo slots ----- */
.photo { position: relative; margin: 0; overflow: hidden; background: var(--ink-800); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-cutout img { object-fit: contain; }
.ph-badge { display: none; position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); gap: 6px; align-items: center; padding: 4px 9px; border-radius: 4px; background: rgba(7,12,28,.82); color: #F5B94A; font-size: 11.5px; font-weight: 650; line-height: 1.25; border: 1px solid rgba(245,185,74,.4); }
.is-placeholder > .ph-badge { display: inline-flex; }
.brand-img.is-ph { opacity: .9; }
@media print { .top, .proto-banner, .foot, .toasts { display: none; } }

/* ======================================================================
   10-customer.css : customer experience, part A. Journey rail, hero with the Progress Ladder,
   spotlight, discovery, model tiles. The customer side runs on the midnight theme set in 00-base.css.
   ====================================================================== */
[data-route="customer"] #shell { background: radial-gradient(1100px 520px at 88% -80px, rgba(110,86,240,.16), transparent 70%), radial-gradient(900px 480px at -8% 38%, rgba(34,211,238,.07), transparent 70%), var(--bg); }
.cx { min-width: 0; }
.cx-fine { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; color: var(--text-3); max-width: 78ch; }

.lede { font-size: clamp(16px, 1.5vw, 18.5px); line-height: 1.55; color: var(--text-2); max-width: 54ch; }
.lbl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lbl-row > label { font-size: 13px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }

/* ----- journey rail ----- */

.cx-steps a { display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 999px; color: var(--text-2); text-decoration: none; font-size: 13.5px; font-weight: 600; white-space: nowrap; }

@media (max-width: 1100px) { .cx-steps .l { display: none; } .cx-steps a[aria-current="step"] .l { display: inline; } .cx-steps a { padding-right: 8px; } }
@media (max-width: 560px) { .cx-plan { display: none; } .cx-rail-in { min-height: 48px; } }

/* channel marks */
.chmark { display: inline-flex; align-items: center; gap: 8px; }
.chmark img.chlogo { height: 16px; width: auto; display: block; }

/* ----- hero ----- */
.cx-hero { position: relative; isolation: isolate; overflow: hidden; border-bottom: 1px solid var(--line); }
.cx-hero-bg { position: absolute; inset: 0; z-index: -2; }

.cx-hero-in { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 72px); align-items: end; padding-top: clamp(36px, 6vw, 84px); padding-bottom: clamp(36px, 5vw, 72px); }

.cx-journeys { display: grid; gap: 16px; margin-top: 4px; }

.cx-jcard { display: grid; gap: 6px; text-align: left; padding: 16px 18px 18px; background: rgba(15,23,51,.72); border: 1px solid var(--line-2); border-radius: var(--r-l); color: var(--text); transition: border-color .15s, background .15s, transform .12s; align-content: start; }
.cx-jcard:hover { border-color: var(--cyan); transform: translateY(-2px); }

.cx-jic { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); }

.cx-jt { font-weight: 700; font-size: 16px; margin-top: 6px; }

@media (max-width: 980px) { .cx-hero-in { grid-template-columns: 1fr; } .cx-hero-scrim { background: linear-gradient(180deg, rgba(7,12,28,.9) 0%, rgba(7,12,28,.82) 60%, var(--bg) 100%); } }
@media (max-width: 560px) { .cx-jcards { grid-template-columns: 1fr; } }

/* ----- stepper ----- */

@media (max-width: 640px) { .dsteps .l { font-size: 11.5px; line-height: 1.2; } .dsteps .n { width: 36px; height: 36px; } .dsteps li + li::before { top: 18px; left: calc(-50% + 18px); width: calc(100% - 36px); } }

.dr-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(16px, 2.4vw, 32px); align-items: start; }
@media (max-width: 960px) { .dr-grid { grid-template-columns: 1fr; } }

.dr-photo .photo, .dr-photo-card .photo { aspect-ratio: 16 / 9; }

  const rowH = 36, labW = Math.min(230, Math.max(120, W * 0.36)), H = o.rows.length * rowH + 40, svg = svgRoot(W, H, 'Tornado chart of NPV sensitivity');
  const vals = o.rows.flatMap(r => [r.lowNpv, r.highNpv]).concat([o.base]); const nt = niceTicks(Math.min(...vals), Math.max(...vals), 5);
  const x0 = labW, x1 = W - 20, sx = v => x0 + (x1 - x0) * (v - nt.lo) / (nt.hi - nt.lo);
  nt.ticks.forEach(t => svg.append(s('line', { class: 'grid', x1: sx(t), x2: sx(t), y1: 20, y2: H - 22 }), s('text', { class: 'ax', x: sx(t), y: H - 6, 'text-anchor': 'middle' }, fInt(t))));
  svg.append(s('text', { class: 'ax ax-title', x: x0, y: 11 }, 'Conditional NPV, ₹ crore'));
  o.rows.forEach((r, i) => {
    const yy = 22 + i * rowH; svg.append(s('text', { class: 'ax lab', x: labW - 10, y: yy + rowH / 2 + 2, 'text-anchor': 'end' }, tr(r.label, Math.floor(labW / 6.2))));
    [['low', r.lowNpv, r.lowText], ['high', r.highNpv, r.highText]].forEach(([k, v, tx]) => {
      const a = sx(Math.min(v, o.base)), b = sx(Math.max(v, o.base));
      const cls = v >= o.base ? 'f0' : 'f3';
      const rect = s('rect', { class: cls, x: a, y: yy + 7, width: Math.max(2, b - a), height: rowH - 16, rx: 2 });
      mark(rect, `${r.label}\n${tx}: NPV ${fCr(v, 1)} (${fSigned(v - o.base, 1)} cr vs live scenario)`); svg.append(rect);
    });
  });
  svg.append(s('line', { class: 'base', x1: sx(o.base), x2: sx(o.base), y1: 16, y2: H - 22 }));
  svg.append(s('text', { class: 'ax val', x: sx(o.base), y: H - 6 - 14, 'text-anchor': 'middle', dy: 0 }, ''));
  return svg;
}

/* ---------- dot-and-interval plot (uplift with 95% interval) ---------- */
function ciPlot(W, o) {
  const rowH = 46, labW = Math.min(210, Math.max(110, W * 0.3)), H = o.rows.length * rowH + 44, svg = svgRoot(W, H, o.label || 'Estimate with 95% interval');
  const vals = o.rows.flatMap(r => [r.lo, r.hi, r.est]).concat([0]); const nt = niceTicks(Math.min(...vals), Math.max(...vals), 6);
  const x0 = labW, x1 = W - 24, sx = v => x0 + (x1 - x0) * (v - nt.lo) / (nt.hi - nt.lo);
  nt.ticks.forEach(t => svg.append(s('line', { class: 'grid' + (t === 0 ? ' zero strong' : ''), x1: sx(t), x2: sx(t), y1: 6, y2: H - 28 }), s('text', { class: 'ax', x: sx(t), y: H - 10, 'text-anchor': 'middle' }, fNum(t, 0))));
  svg.append(s('text', { class: 'ax ax-title', x: x1, y: H - 28 + 0, 'text-anchor': 'end', dy: 0 }, ''));
  o.rows.forEach((r, i) => {
    const yy = 8 + i * rowH, cy = yy + rowH / 2 - 2;
    svg.append(s('text', { class: 'ax lab', x: labW - 10, y: cy + 3, 'text-anchor': 'end' }, tr(r.label, Math.floor(labW / 6.2))));
    const crosses = r.lo <= 0 && r.hi >= 0;
    const g = s('g'); mark(g, `${r.label}\nEstimate ${fSigned(r.est, 2)} pp\n95% interval ${fSigned(r.lo, 2)} to ${fSigned(r.hi, 2)} pp\n${crosses ? 'The interval includes zero: no effect cannot be ruled out.' : 'The interval excludes zero.'}`);
    g.append(s('line', { class: 'ci k0', x1: sx(r.lo), x2: sx(r.hi), y1: cy, y2: cy }), s('line', { class: 'ci k0', x1: sx(r.lo), x2: sx(r.lo), y1: cy - 7, y2: cy + 7 }), s('line', { class: 'ci k0', x1: sx(r.hi), x2: sx(r.hi), y1: cy - 7, y2: cy + 7 }), s('circle', { class: 'f0 pt', cx: sx(r.est), cy, r: 6 }));
    svg.append(g);
    svg.append(s('text', { class: 'ax val', x: sx(r.est), y: cy - 12, 'text-anchor': 'middle' }, fSigned(r.est, 2) + ' pp'));
  });
  return svg;
}

/* ---------- price corridors against a budget line (customer; ex-showroom, lakh) ---------- */
function corridors(W, o) {
  const rowH = 38, labW = Math.min(150, Math.max(92, W * 0.26)), H = o.rows.length * rowH + 42, svg = svgRoot(W, H, 'Ex-showroom price ranges compared with your budget');
  const lo = 5, hi = Math.max(25, Math.ceil(Math.max(...o.rows.map(r => r.max), o.budget) / 5) * 5); const x0 = labW, x1 = W - 16, sx = v => x0 + (x1 - x0) * (v - lo) / (hi - lo);
  for (let t = lo; t <= hi; t += 5) svg.append(s('line', { class: 'grid', x1: sx(t), x2: sx(t), y1: 18, y2: H - 22 }), s('text', { class: 'ax', x: sx(t), y: H - 6, 'text-anchor': 'middle' }, t + 'L'));
  o.rows.forEach((r, i) => {
    const yy = 22 + i * rowH, cy = yy + rowH / 2;
    svg.append(s('text', { class: 'ax lab' + (r.dim ? ' dim' : ''), x: labW - 10, y: cy + 3, 'text-anchor': 'end' }, tr(r.label, Math.floor(labW / 6.4))));
    const bar = s('rect', { class: (r.cls || 'f0') + (r.dim ? ' dimmed' : ''), x: sx(r.min), y: cy - 8, width: Math.max(4, sx(r.max) - sx(r.min)), height: 16, rx: 3 });
    mark(bar, `${r.label}\nIllustrative ex-showroom range: ${fLakh(r.min, 2)} to ${fLakh(r.max, 2)}\n${r.min <= o.budget ? (r.max <= o.budget ? 'Whole range is within your budget.' : 'Entry price is within your budget; higher variants are above it.') : 'Entry price is above your budget.'}`);

  return svg;
}

/* ---------- one stacked horizontal bar (status mix) ---------- */
function stackBar(W, o) {
  const total = sum(o.segs.map(x => x.value)), H = 38, svg = svgRoot(W, H, o.label || 'Distribution'); let x = 0;

  o.segs.forEach(sg => { if (!sg.value) return; const w = W * sg.value / total; const r = s('rect', { class: sg.cls + ' gap', x, y: 6, width: Math.max(1, w), height: 26 }); mark(r, `${sg.name}: ${fInt(sg.value)} (${fPct(sg.value / total, 1)})`); svg.append(r); if (w > 34) svg.append(s('text', { class: 'ax seg', x: x + w / 2, y: 24, 'text-anchor': 'middle' }, fInt(sg.value))); x += w; });

}

/* Arrow keys move through a radio group, as the ARIA radio pattern promises. Space or Enter (the button's own click) selects. */

  const g = e.target.closest && e.target.closest('[role="radiogroup"]'); if (!g || e.target.getAttribute('role') !== 'radio') return;
  const all = $$('[role="radio"]:not([disabled])', g), i = all.indexOf(e.target); if (i < 0) return;
